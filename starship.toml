"$schema" = 'https://starship.rs/config-schema.json'

# VANTA // BLACK SIGIL
# O mesmo arquivo no Linux e no Windows. $type troca Windows por Arch, Ubuntu, etc.
add_newline = false
scan_timeout = 100
command_timeout = 1000
palette = 'vanta'

format = """
[╭─](bold crimson)[ 𝖁𝕬𝕹𝕿𝕬 ](bold ivory)[ ╱╱ ](muted)$os
[│](crimson) $time
[├─](crimson) $directory$git_branch$git_status$rust$cmd_duration$status
[╰─](bold crimson)$character"""

[palettes.vanta]
crimson = '#C21F36'
blood = '#7D1425'
ivory = '#E8DFE1'
muted = '#665A60'
steel = '#A49AA0'
dim = '#393237'

[os]
disabled = false
format = '[ ▣ $type](muted) '
style = 'bold muted'

[os.symbols]
AIX = " "
AlmaLinux = " "
Alpaquita = " "
Alpine = " "
ALTLinux = " "
Amazon = " "
Android = " "
AOSC = " "
Arch = " "
Artix = " "
Bazzite = " "
Bluefin = " "
CachyOS = " "
CentOS = " "
Debian = " "
DragonFly = " "
Elementary = " "
Emscripten = " "
EndeavourOS = " "
Fedora = " "
FreeBSD = " "
Garuda = " "
Gentoo = " "
HardenedBSD = "󰞌 "
Hurd = " "
Illumos = " "
InstantOS = " "
Ios = "󰀷 "
Kali = " "
KDENeon = " "
Linux = " "
Mabox = " "
Macos = " "
Manjaro = " "
Mariner = " "
MidnightBSD = " "
Mint = " "
NetBSD = " "
NixOS = " "
Nobara = " "
OpenBSD = " "
OpenCloudOS = " "
openEuler = " "
openSUSE = " "
OracleLinux = "󰺡 "
PikaOS = " "
Pop = " "
Raspbian = " "
Redhat = "󱄛 "
RedHatEnterprise = "󱄛 "
Redox = "󰀘 "
RockyLinux = " "
Solus = " "
SUSE = " "
Ubuntu = " "
Ultramarine = " "
Unknown = " "
Uos = " "
Void = " "
Windows = "󰍲 "
Zorin = " "

[directory]
format = '[⌘ $path]($style)[$read_only]($read_only_style)'
style = 'bold ivory'
truncation_length = 4
truncate_to_repo = false
truncation_symbol = '…/'
read_only = ' [LOCK]'
read_only_style = 'bold crimson'
home_symbol = '~'
use_os_path_sep = false
before_repo_root_style = 'muted'
repo_root_style = 'bold ivory'
repo_root_format = '[⌘ $before_root_path]($style)[$repo_root]($repo_root_style)[$path]($style) '

[git_branch]
symbol = ' ⎇ '
format = '[╺](dim)[ $symbol$branch ](bold crimson)'
style = 'bold crimson'
truncation_length = 32
truncation_symbol = '…'

[git_status]
format = '[$all_status$ahead_behind](bold blood) '
conflicted = '[≠${count}](bold crimson) '
ahead = '[↑${count}](steel) '
behind = '[↓${count}](steel) '
diverged = '[↕${ahead_count}/${behind_count}](bold crimson) '
untracked = '[?${count}](muted) '
stashed = '[≡${count}](steel) '
modified = '[~${count}](crimson) '
staged = '[+${count}](ivory) '
renamed = '[»${count}](steel) '
deleted = '[×${count}](bold crimson) '

[rust]
symbol = 'ᚱ '
format = '[╺](dim)[ $symbol$version ](bold steel)'
style = 'bold steel'
detect_extensions = ['rs']
detect_files = ['Cargo.toml']
detect_folders = []

[time]
disabled = false
format = '[ ⧗ $time ](muted)'
time_format = '%a · %d/%m/%Y · %H:%M:%S'
style = 'muted'
utc_time_offset = 'local'

[cmd_duration]
min_time = 500
format = '[╺](dim)[ ◷ $duration ](steel)'
style = 'steel'
show_milliseconds = true

[status]
disabled = false
format = '[╺](dim)[ $symbol EXIT:$status ](bold crimson)'
symbol = '✗'
success_symbol = ''
map_symbol = true
recognize_signal_code = true
pipestatus = true

[character]
success_symbol = '[ ❯](bold crimson)'
error_symbol = '[ ✗](bold crimson)'
vimcmd_symbol = '[ ❮](bold ivory)'
vimcmd_replace_one_symbol = '[ ◂](bold crimson)'
vimcmd_replace_symbol = '[ ◀](bold crimson)'
vimcmd_visual_symbol = '[ ◇](bold ivory)'
